<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Cute Photobooth</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="left">
        <h1 class="title">Photo Booth by amel</h1>

        <div class="viewer">
            <video id="video" autoplay playsinline></video>
            <div id="countdown"></div>
        </div>
        <div class="filter-area">
            <h3>Filter</h3>
            <div class="palette" id="filterPalette"></div>
        </div>

        <div class="controls">
            <button id="capture" class="btn primary">Capture</button>
            <button id="retake" class="btn neutral">Retake</button>
            <button id="download" class="btn neutral">Download</button>
        </div>


    </div>

    <div class="right">

        <div class="panel">
            <div class="strip" id="photoStrip">
                <div class="strip-slot"><img id="slot0"></div>
                <div class="strip-slot"><img id="slot1"></div>
                <div class="strip-slot"><img id="slot2"></div>
                <div class="strip-caption">photobooth by amel</div>
            </div>
        </div>
        <div class="panel">
            <h3>Frame</h3>
            <div class="palette" id="framePalette"></div>
        </div>

    </div>

    <canvas id="canvas" style="display:none"></canvas>
    <script src="script.js"></script>
</body>

</html>
